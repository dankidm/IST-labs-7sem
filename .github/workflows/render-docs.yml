name: Render PlantUML docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Graphviz and PlantUML
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz fonts-dejavu-core
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/plantuml.jar" \
            https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar

      - name: Check syntax
        run: |
          test -n "$(find src -type f -name '*.puml' -print -quit)"
          find src -type f -name '*.puml' -print0 | \
            xargs -0 java -Djava.awt.headless=true -jar "$RUNNER_TEMP/plantuml.jar" -checkonly -failonerror

      - name: Render diagrams
        run: |
          mkdir -p "$RUNNER_TEMP/architecture-images"
          find src -type f -name '*.puml' -print0 | \
            xargs -0 java -Djava.awt.headless=true -jar "$RUNNER_TEMP/plantuml.jar" \
              -tpng -failonerror -o "$RUNNER_TEMP/architecture-images"
          echo "Rendered PNG files:"
          find "$RUNNER_TEMP/architecture-images" -type f -name '*.png' -printf '%f\n' | sort
          find "$RUNNER_TEMP/architecture-images" -type f -name '*.png' | wc -l

      - name: Upload images as artifact
        uses: actions/upload-artifact@v4
        with:
          name: diagrams
          path: ${{ runner.temp }}/architecture-images/*.png
          if-no-files-found: error
          retention-days: 90
